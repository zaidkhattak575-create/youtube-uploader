<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview & Upload</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f;
    color: #f1f1f1;
    margin: 0;
    padding: 16px;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; }
  .badge {
    display: inline-block;
    background: #2a1f3d;
    color: #b794f6;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    margin-bottom: 14px;
  }
  .card {
    background: #1c1c1c;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    background: #ff0000;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    width: 100%;
    text-align: center;
    margin-top: 10px;
  }
  .btn.secondary {
    background: #333;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: #ccc;
    margin: 14px 0 6px;
  }
  input[type="text"], textarea, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #111;
    color: #fff;
    font-size: 0.95rem;
  }
  textarea { resize: vertical; min-height: 140px; }
</style>
</head>
<body>
<div class="container">
  <h1>✅ Preview</h1>
  <div class="badge">🤖 AI ne generate kiya hai — chahen to edit karein</div>

  <div class="card">
    <form action="{{ url_for('upload') }}" method="post">
      <label>Title</label>
      <input type="text" name="title" value="{{ title }}" required>

      <label>Description</label>
      <textarea name="description">{{ description }}</textarea>

      <label>Tags</label>
      <input type="text" name="tags" value="{{ tags }}">

      <label>Privacy</label>
      <select name="privacy">
        <option value="private">Private (sirf aap dekh sakein)</option>
        <option value="unlisted">Unlisted (link se dekha ja sake)</option>
        <option value="public" selected>Public (sab dekh sakein)</option>
      </select>

      <label>Category</label>
      <select name="category">
        <option value="22">People & Blogs</option>
        <option value="24">Entertainment</option>
        <option value="27">Education</option>
        <option value="28">Science & Tech</option>
        <option value="20">Gaming</option>
        <option value="10">Music</option>
      </select>

      <button type="submit" class="btn">🚀 Final Upload Karein</button>
    </form>
    <a href="{{ url_for('index') }}" class="btn secondary">Cancel / Wapas Jayein</a>
  </div>
</div>
</body>
</html>
